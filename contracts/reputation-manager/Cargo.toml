[package]
name = "reputation-manager"
version = "0.1.3"
edition = "2021"

[dependencies]
stylus-sdk = "0.10.8"
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-sol-types = { version = "1.5.7", default-features = false }

[features]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("contract-client-gen"))'] }